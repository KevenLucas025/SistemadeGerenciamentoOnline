{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Sistema de Gerenciamento</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_css %}{% endblock %}

    <link rel="icon"
          type="image/png"
          href="{% static 'img/SIstema_de_Gerenciamento.png' %}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

    <!-- Toast -->
    <div id="toastAlerta" class="toast-alerta"></div>


    <!-- Menu lateral (Apenas se o usuário estiver logado) -->
    {% if not esconder_menu %}
        {% include "menu_lateral.html" %}
    {% endif %}


    <!-- Área principal do sistema -->
    <div class="{% if not esconder_menu %}layout-container{% else %}auth-container-wrapper{% endif %}">


        <!-- Topbar (Apenas se o usuário estiver logado) -->
        {% if not esconder_menu %}
            {% include "topbar.html" %}
        {% endif %}


        <!-- Conteúdo das páginas -->
        <main class="main-content">

            {% block content %}
            {% endblock %}

        </main>


    </div>


    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


    <!-- Scripts -->
    <script src="{% static 'js/funcoes.js' %}"></script>
    {% if user.is_authenticated %}
        <script src="{% static 'js/menu_lateral.js' %}"></script>
    {% endif %}

</body>

</html>
